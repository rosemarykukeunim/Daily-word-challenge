<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Daily Word Challenge</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="game-header">
    <h1>Daily Word Challenge</h1>
    <p>Guess the 5-letter word</p>
  </header>

  <main class="game-container">

    <!-- Game Board -->
    <section class="game-board" id="gameBoard">

      <!-- Row 1 -->
      <div class="row">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>

      <!-- Row 2 -->
      <div class="row">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>

      <!-- Row 3 -->
      <div class="row">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>

      <!-- Row 4 -->
      <div class="row">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>

      <!-- Row 5 -->
      <div class="row">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>

      <!-- Row 6 -->
      <div class="row">
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
      </div>

    </section>

    <!-- Message -->
    <p id="message"></p>

    <!-- Keyboard -->
    <section class="keyboard" id="keyboard">

      <div class="keyboard-row">
        <button>Q</button>
        <button>W</button>
        <button>E</button>
        <button>R</button>
        <button>T</button>
        <button>Y</button>
        <button>U</button>
        <button>I</button>
        <button>O</button>
        <button>P</button>
      </div>

      <div class="keyboard-row">
        <button>A</button>
        <button>S</button>
        <button>D</button>
        <button>F</button>
        <button>G</button>
        <button>H</button>
        <button>J</button>
        <button>K</button>
        <button>L</button>
      </div>

      <div class="keyboard-row">
        <button id="enter">ENTER</button>
        <button>Z</button>
        <button>X</button>
        <button>C</button>
        <button>V</button>
        <button>B</button>
        <button>N</button>
        <button>M</button>
        <button id="backspace">⌫</button>
      </div>

    </section>

  </main>

  <footer>
    <p>Come back tomorrow for a new word.</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
